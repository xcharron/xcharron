<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline</title>
    <!-- Styles are inline on purpose: this page has to render with no network
         and no cached stylesheet. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0b;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.5rem; color: #a1a1a1; line-height: 1.5; }
      button {
        background: #f5f5f5;
        color: #0b0b0b;
        border: 0;
        border-radius: 8px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page needs a connection.<br>Check your signal and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
